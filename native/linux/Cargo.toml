[package]
name = "chatroom-computer-helper"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
atspi = "0.30"
base64 = "0.22"
futures-lite = "2"
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
x11rb = { version = "0.14", features = ["image", "randr", "xtest"] }
zbus = "5"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
